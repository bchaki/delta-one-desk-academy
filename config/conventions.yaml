as_of: 2026-11-21
source: "Public central-bank / exchange documentation and FCA T+1 page (https://www.fca.org.uk/markets/about-t1-settlement); summarised for teaching"
verify: true

# Overnight risk-free benchmarks. LIBOR is discontinued and appears only as history.
benchmarks:
  SOFR:  {ccy: USD, day_count: "ACT/360",  name: "Secured Overnight Financing Rate"}
  ESTR:  {ccy: EUR, day_count: "ACT/360",  name: "Euro short-term rate"}
  SONIA: {ccy: GBP, day_count: "ACT/365F", name: "Sterling Overnight Index Average"}
  TONA:  {ccy: JPY, day_count: "ACT/365F", name: "Tokyo Overnight Average rate"}
  SARON: {ccy: CHF, day_count: "ACT/360",  name: "Swiss Average Rate Overnight"}

# Market conventions. Transaction taxes are one-way rates in bps on the notional (buy side
# for stamp duty; both sides for FTT as noted). Illustrative: verify against the official source.
markets:
