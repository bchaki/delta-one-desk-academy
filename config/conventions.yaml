    name: "United States"
    ccy: USD
    calendar: US
    benchmark: SOFR
    settlement_days: 1
    settlement_note: "T+1 since May 2024"
    hours: "09:30-16:00 ET"
    open_auction: "09:30 ET opening cross"
    close_auction: "16:00 ET closing cross"
