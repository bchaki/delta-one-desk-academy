as_of: 2026-11-21
source: "Stylised factor moves in the spirit of each episode. They are teaching approximations, not historical records."
verify: true

# equity_pct: % move by region. vol_pts: implied vol change (points). rates_bps: parallel move on
# the overnight/term curve by benchmark. fx_pct: % move in the quoted pair (EURUSD, GBPUSD, USDJPY).
# div_pct: % change in forecast dividends by region. borrow_bps: change in borrow fees (bps)
# for the tier. single_name_pct: shock applied to the flagged single name only.
scenarios:
  crash_1987:
    name: "1987-type crash"
    kind: historical_style
    equity_pct: {US: -22.0, EU: -18.0, UK: -20.0, JP: -15.0}
    vol_pts: 30
    rates_bps: {SOFR: -50, ESTR: -30, SONIA: -40, TONA: -10}
    fx_pct: {EURUSD: 1.0, GBPUSD: 1.0, USDJPY: -2.0}
    div_pct: {US: -5.0, EU: -5.0, UK: -5.0, JP: -5.0}
    borrow_bps: {GC: 20, warm: 100, special: 400, hard_to_borrow: 1500}
    single_name_pct: 0.0
  gfc_2008:
