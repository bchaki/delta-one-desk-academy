questions:
- id: me01
  type: mcq
  difficulty: 1
  prompt: 'A stale price is:'
  options:
  - An unchanged price on a stock that traded
  - A rising price
  - A rounded price
  - A foreign price
  answer: 0
  explanation: An exact repeat is a first flag.
- id: me02
  type: mcq
  difficulty: 1
  prompt: Which price should an ETF mark use?
  options:
  - The primary listing's close
  - Any venue
  - The NAV of last week
  - The ask
  answer: 0
  explanation: Use the official source.
- id: me03
  type: numeric
  difficulty: 2
  prompt: 'Impact: 5,000 shares marked 20.40 instead of 20.00.'
  answer: 2000.0
  tolerance: 0.01
  explanation: 5,000 x 0.40 = 2,000 overstated.
  unit: currency units
- id: me04
  type: numeric
  difficulty: 2
  prompt: 'Source difference in bps: primary 50.00, secondary 50.25.'
  answer: 50.0
  tolerance: 0.01
  explanation: 0.5% = 50 bps.
  unit: bps
- id: me05
  type: mcq
  difficulty: 2
  prompt: 'A stale mark usually:'
  options:
  - Reverses when the price corrects
