questions:
- id: ce01
  type: mcq
  difficulty: 1
  prompt: 'Cost of exposure is measured:'
  options:
  - In excess of the benchmark rate
  - As total return
  - As price change
  - As tax
  answer: 0
  explanation: Relative to holding cash.
- id: ce02
  type: numeric
  difficulty: 2
  prompt: 'Running cost: 20m, spread 30 + fee 5 + leakage 10 bps, 180 days basis 360.'
  answer: 45000.0
  tolerance: 0.01
  explanation: 20m x 45 bps x 0.5 = 45,000.
  unit: currency units
- id: ce03
  type: numeric
  difficulty: 2
  prompt: 'Trading cost: 20m, one-way 2 bps, 1 round trip, one-off 1 bp.'
  answer: 10000.0
  tolerance: 0.01
  explanation: 20m x (2 x 2 + 1) bps = 10,000.
  unit: currency units
- id: ce04
  type: mcq
  difficulty: 2
  prompt: 'Rolling a futures position:'
  options:
  - Adds another round trip of trading cost
  - Is free
  - Removes financing
  - Cancels margin
  answer: 0
  explanation: Each roll closes one contract and opens another.
- id: ce05
  type: mcq
  difficulty: 2
  prompt: Which wrapper has no roll?
  options:
  - Swap, ETF and cash
  - Only futures
  - Only swaps
  - None
  answer: 0
  explanation: Futures expire; the others do not.
- id: ce06
  type: numeric
  difficulty: 3
  prompt: 'Breakeven: A fixed 8 / 10 pa; B fixed 3 / 40 pa (days, basis 360).'
