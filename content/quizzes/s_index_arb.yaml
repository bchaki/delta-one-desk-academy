questions:
- id: ia01
  type: mcq
  difficulty: 1
  prompt: 'A future trades above its model fair value by more than costs. The arbitrage is:'
  options:
  - Sell the future and buy the basket
  - Buy the future and sell the basket
  - Buy both
  - Do nothing
  answer: 0
  explanation: 'Rich future: cash-and-carry.'
- id: ia02
  type: mcq
  difficulty: 1
  prompt: 'The reverse cash-and-carry is done when the future is:'
  options:
  - 'Cheap: buy the future and short the basket'
  - 'Rich: sell the future'
  - At fair value
  - Expiring
  answer: 0
  explanation: 'Cheap future: reverse.'
- id: ia03
  type: numeric
  difficulty: 2
  prompt: Rich entry 3.0 points, exit 0.5, cost 0.4 points. Net points?
  answer: 2.1
  tolerance: 1.0e-06
  explanation: 3.0 - 0.5 - 0.4 = 2.1.
  unit: index points
