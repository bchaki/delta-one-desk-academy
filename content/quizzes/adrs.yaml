questions:
- id: ad01
  type: mcq
  difficulty: 1
  prompt: 'An ADR''s ratio of 0.5 means:'
  options:
  - One ADR represents half a local share
  - Two ADRs per share
  - The ADR is half the price
  - The fee is 0.5
  answer: 0
  explanation: The ratio is local shares per ADR.
