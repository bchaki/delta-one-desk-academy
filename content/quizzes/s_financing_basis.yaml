questions:
- id: fb01
  type: mcq
  difficulty: 1
  prompt: 'The benchmark cancels in swap carry because:'
  options:
  - The client pays it and the desk pays it on the hedge
  - It is zero
  - It is a fee
  - Both sides ignore it
  answer: 0
  explanation: Spread over benchmark minus FTP over benchmark.
- id: fb02
  type: numeric
  difficulty: 2
  prompt: 'Carry: 40m, spread 70 bps, FTP 40, balance sheet 10, 360 days (USD).'
  answer: 80000.0
  tolerance: 1
  explanation: 40m x 20 bps = 80,000.
  unit: currency units
- id: fb03
  type: numeric
  difficulty: 2
  prompt: 'Futures hedge net: spread 70, implied 25, margin 4%, FTP 40 (bps).'
  answer: 43.4
  tolerance: 1.0e-06
  explanation: 70 - 25 - 1.6 = 43.4.
  unit: bps
- id: fb04
  type: mcq
  difficulty: 2
  prompt: 'Which hedge is better: stock net 20, futures net 43.4?'
  options:
  - Futures
  - Stock
  - Equal
  - Neither
  answer: 0
  explanation: Larger net spread.
- id: fb05
  type: numeric
  difficulty: 2
  prompt: FTP shock of 30 bps held 90 days on 20m (negative = cost).
  answer: -15000.0
  tolerance: 1
  explanation: -20m x 0.003 x 0.25 = -15,000.
  unit: currency units
- id: fb06
  type: mcq
  difficulty: 2
  prompt: 'Break-even FTP equals:'
