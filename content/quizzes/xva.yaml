questions:
- id: xv01
  type: mcq
  difficulty: 1
  prompt: 'Expected exposure counts:'
  options:
  - Only positive values of what the client owes
  - Negative values too
  - Only today's MTM
  - Only collateral
  answer: 0
  explanation: Exposure is what the desk could lose.
- id: xv02
  type: mcq
  difficulty: 1
  prompt: 'PFE is:'
  options:
  - A high quantile of future exposure
  - The average
  - The minimum
  - Today's MTM
  answer: 0
  explanation: For example the 95th percentile.
- id: xv03
  type: mcq
  difficulty: 2
  prompt: 'A TRS with periodic resets has an exposure profile that:'
  options:
  - Saw-tooths, falling at each reset
  - Grows steadily
  - Is flat
  - Is negative
  answer: 0
  explanation: Resets bring MTM to zero.
- id: xv04
  type: mcq
  difficulty: 2
  prompt: 'The margin period of risk is:'
  options:
  - Time between the last collateral exchange and close-out
  - The tenor
  - The reset period
  - The CSA threshold
  answer: 0
  explanation: Typically about 10 business days.
