questions:
- id: pl01
  type: numeric
  difficulty: 1
  prompt: 'Continuous forward: S=200, r=3%, q=1%, T=1.'
  answer: 204.040268
  tolerance: 0.001
  explanation: 200 e^0.02 = 204.04.
- id: pl02
  type: mcq
  difficulty: 1
  prompt: 'In the discrete model, dividends are:'
  options:
  - Reinvested at the financing rate from ex-date to expiry
  - Ignored
  - Paid at expiry
  - Added to spot
  answer: 0
  explanation: Each dividend is grown forward at r.
