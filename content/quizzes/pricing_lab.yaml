  type: numeric
  difficulty: 3
  prompt: 'Price basis for a TRF: S=4,000, spread 20 bps, benchmark 3%, tau 0.5, FV divs 25.'
  answer: 39.0
  tolerance: 0.01
  explanation: 4,000 x 3.2% x 0.5 - 25 = 39.
