- id: pl04
  type: mcq
  difficulty: 2
  prompt: 'A future priced above fair value with funding below the implied repo implies:'
  options:
  - Cash-and-carry is attractive
  - Reverse carry
  - No trade
  - A dividend cut
  answer: 0
  explanation: The implied financing is higher than your cost.
