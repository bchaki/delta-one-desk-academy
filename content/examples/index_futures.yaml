# Golden worked examples for the Index Futures module. The lesson reads these values through
# {{ex.<id>.<path>}} tokens and tests/test_golden.py recomputes every one with core.
examples:
  fair_value:
    fn: core.pricing.futures.model_forward
    args: {spot: 5000.0, r: 0.045, divs: [[0.1, 15.0]], t: 0.25}
    expected: 5041.466004
    tolerance: 1.0e-5
    note: "F = 5000 e^(0.045 x 0.25) - 15 e^(0.045 x 0.15) = 5056.5676 - 15.1016"
  implied_repo_simple:
    fn: core.pricing.futures.implied_repo_simple
    args: {spot: 5000.0, fut: 5040.0, fv_divs: 14.5, days: 91, basis: 360}
    expected: 0.0431208791
    tolerance: 1.0e-8
    note: "((5040 + 14.5) / 5000 - 1) x 360 / 91, ACT/360 simple"
  implied_repo_exact:
    fn: core.pricing.futures.implied_repo
    args: {spot: 5000.0, fut: 5040.0, divs: [[0.1, 15.0]], t: 0.2493150684931507}
    expected: 0.0439583562
    tolerance: 1.0e-8
    note: "Continuously compounded rate that reproduces the 5040 price (Brent root)"
  no_arb_band:
    fn: core.pricing.futures.no_arbitrage_band
    args: {spot: 5000.0, divs: [[0.1, 15.0]], t: 0.25, funding_long: 0.049, rebate_short: 0.041, cost_bps: 3.0}
    expected: {lower: 5034.921022, upper: 5048.016037, mid: 5041.466004}
    tolerance: 1.0e-5
    note: "Upper uses 4.9% funding for longs, lower uses a 4.1% short rebate, each +/- 3 bps of spot costs"
  roll_cost:
    fn: core.pricing.futures.roll_cost_bps_per_year
    args: {f_near: 5040.0, f_far: 5075.0, dt: 0.25}
    expected: 277.7777778
    tolerance: 1.0e-6
    note: "(5075 - 5040) / 5040 / 0.25 x 10,000"
  trf_basis:
    fn: core.pricing.trf.trf_spread_to_price_basis
    args: {spot: 5000.0, spread_bps: 40.0, benchmark: 0.043, tau: 0.25, fv_divs: 14.5}
    expected: 44.25
    tolerance: 1.0e-9
    note: "5000 x (4.3% + 0.40%) x 0.25 - 14.5"
  trf_spread_from_price:
    fn: core.pricing.trf.price_basis_to_trf_spread_bps
    args: {spot: 5000.0, fut: 5040.0, benchmark: 0.043, tau: 0.25, fv_divs: 14.5}
    expected: 6.0
    tolerance: 1.0e-6
    note: "((5040 - 5000 + 14.5) / (5000 x 0.25) - 4.3%) x 10,000"
  futures_pnl:
    fn: core.pricing.futures.futures_pnl
    args: {qty: 10, multiplier: 50.0, price0: 5000.0, price1: 5012.0}
    expected: 6000.0
    tolerance: 1.0e-9
    note: "10 x 50 x 12"
  variation_margin:
    fn: core.margin.exchange.variation_margin_flows
    args: {qty: 10, multiplier: 50.0, prices: [5000.0, 5012.0, 5004.0]}
    expected: [6000.0, -4000.0]
    tolerance: 1.0e-9
    note: "Day 1 +12 points, day 2 -8 points, on 10 contracts of 50"
  trf_funding:
    fn: core.pricing.trf.trf_funding_amount
    args: {notional: 25000000.0, benchmark: 0.043, spread_bps: 40.0, days: 91, basis: 360}
    expected: 297013.8889
    tolerance: 1.0e-3
    note: "25m x 4.70% x 91/360, owed by the long, ACT/360"
