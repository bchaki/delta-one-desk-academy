examples:
  cost:
    fn: core.strategies.roll.roll_cost_points
    args:
      near: 5000.0
      far: 5030.0
    expected: 30.0
    tolerance: 1.0e-09
    note: 30 points
  pnl:
    fn: core.strategies.roll.roll_pnl
    args:
      contracts: 10.0
      multiplier: 50.0
      near: 5000.0
      far: 5030.0
    expected: -15000.0
    tolerance: 1.0e-09
    note: long pays 15,000
  bps:
    fn: core.pricing.futures.roll_cost_bps_per_year
    args:
      f_near: 5000.0
      f_far: 5030.0
      dt: 0.25
    expected: 240.0
    tolerance: 1.0e-06
    note: 30/5000/0.25
  rich:
    fn: core.pricing.futures.roll_richness_bps_per_year
    args:
      f_near: 5000.0
      f_far: 5030.0
      fair_spread: 25.0
      dt: 0.25
    expected: 40.0
    tolerance: 1.0e-06
    note: 5/5000/0.25
  drag:
    fn: core.strategies.roll.annual_roll_drag
    args:
      cost_bps_pa: 240.0
      rolls_per_year: 4.0
    expected: 60.0
    tolerance: 1.0e-09
    note: 240/4
  fair_sp:
    fn: core.pricing.futures.calendar_spread_fair
    args:
      spot: 5000.0
      divs: []
      t_near: 0.25
      t_far: 0.5
      r: 0.05
    expected: 63.68334491897258
    tolerance: 1.0e-06
    note: no dividends
