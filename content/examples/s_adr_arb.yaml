examples:
  fv:
    fn: core.pricing.adr.adr_fair_value
    args:
      local_price: 25.0
      ratio: 2.0
      fx: 1.1
    expected: 55.0
    tolerance: 1.0e-09
    note: 25 x 2 x 1.1
  band:
    fn: core.pricing.adr.adr_band
    args:
      local_price: 25.0
      ratio: 2.0
      fx: 1.1
      conversion_fee_per_adr: 0.02
      cost_bps: 10.0
    expected:
      fair_value: 55.0
      lower: 54.925000000000004
      upper: 55.07500000000001
    tolerance: 1.0e-09
    note: 55 +/- 0.075
  bps:
    fn: core.strategies.adr_arb.band_bps
    args:
      fee_per_adr: 0.02
      fair: 55.0
      cost_bps: 10.0
    expected: 13.636363636363637
    tolerance: 1.0e-09
    note: fee in bps plus costs
  edge:
    fn: core.pricing.adr.adr_arbitrage
    args:
      adr_price: 55.2
      band:
        $: core.pricing.adr.AdrBand
        kwargs:
          fair_value: 55.0
          lower: 54.925000000000004
          upper: 55.07500000000001
    expected:
    - sell_adr_buy_local_issue
    - 0.1249999999999929
    tolerance: 1.0e-09
    note: ADR rich by 0.125 after costs
