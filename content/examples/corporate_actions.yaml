examples:
  split:
    fn: core.corporate_actions.split
    args:
      new_per_old: 2.0
    expected:
      qty_factor: 2.0
      price_factor: 0.5
    tolerance: 1.0e-12
    note: 2-for-1
  terp:
    fn: core.corporate_actions.rights_issue_terp
    args:
      price_cum: 50.0
      subscription_price: 40.0
      new_per_old: 0.25
    expected: 48.0
    tolerance: 1.0e-09
    note: (50 + 0.25 x 40) / 1.25
  rights:
    fn: core.corporate_actions.rights_issue
    args:
      price_cum: 50.0
      subscription_price: 40.0
      new_per_old: 0.25
    expected:
      qty_factor: 1.0416666666666667
      price_factor: 0.96
    tolerance: 1.0e-09
    note: qty 50/48, price 48/50
  spin:
    fn: core.corporate_actions.spin_off
    args:
      price_cum: 100.0
      spin_value_per_old_share: 12.0
      new_per_old: 0.5
    expected:
      price_factor: 0.88
      new_asset_price: 24.0
      new_asset_ratio: 0.5
    tolerance: 1.0e-09
    note: (100 - 12)/100; 12/0.5
  cash_merger:
    fn: core.corporate_actions.cash_merger
    args:
      offer_price: 31.25
    expected:
      qty_factor: 0.0
      cash_per_old_share: 31.25
    tolerance: 1.0e-09
    note: close position, receive offer
  stock_merger:
    fn: core.corporate_actions.stock_merger
    args:
      target_price: 30.0
      acquirer_price: 50.0
      exchange_ratio: 0.5
      cash_per_share: 5.0
    expected:
      qty_factor: 0.5
      price_factor: 1.6666666666666667
      cash_per_old_share: 5.0
    tolerance: 1.0e-09
    note: 0.5 x 50 + 5 = 30
