examples:
  impact:
    fn: core.pricing.program_trading.sqrt_impact_bps
    args:
      k: 0.7
      daily_vol: 0.02
      qty: 100000.0
      adv: 1000000.0
    expected: 44.27188724235731
    tolerance: 1.0e-06
    note: 0.7 x 2% x sqrt(0.1) x 10,000
  risk_charge:
    fn: core.pricing.program_trading.risk_charge_bps
    args:
      daily_vol: 0.012
      horizon_days: 2.0
      risk_aversion: 0.5
    expected: 84.85281374238572
    tolerance: 1.0e-06
    note: 1.2% x sqrt(2) x 0.5 x 10,000
  basket_vol:
    fn: core.pricing.program_trading.basket_daily_vol
    args:
      legs: &id001
      - $: core.pricing.program_trading.BasketLeg
        kwargs:
          qty: 100000.0
          price: 50.0
          adv: 1000000.0
          daily_vol: 0.02
      - $: core.pricing.program_trading.BasketLeg
        kwargs:
          qty: 50000.0
          price: 100.0
          adv: 500000.0
          daily_vol: 0.015
      rho: 0.5
    expected: 0.01520690632574555
    tolerance: 1.0e-09
    note: equal notionals, rho 0.5
  risk_bid:
    fn: core.pricing.program_trading.principal_risk_bid
    args:
      legs: *id001
      half_spread_bps: 2.0
      impact_k: 0.7
      rho: 0.5
      horizon_days: 2.0
      risk_aversion: 0.5
    expected:
      total_bps: 148.2669671750955
      total_amount: 148266.9671750955
    tolerance: 1.0e-06
    note: half spread + weighted impact + risk charge
  win_pnl:
    fn: core.pricing.program_trading.win_pnl_moments
    args:
      bid:
        $: core.pricing.program_trading.principal_risk_bid
        kwargs:
          legs: *id001
          half_spread_bps: 2.0
          impact_k: 0.7
          rho: 0.5
          horizon_days: 2.0
          risk_aversion: 0.5
    expected:
    - 107529.06583803285
    - 215058.1316760657
    tolerance: 0.0001
    note: mean = risk charge in money; std = vol x sqrt(h) x notional
