examples:
  swap_pnl:
    fn: core.pricing.dividend_derivs.dividend_swap_pnl
    args:
      units: 1000.0
      strike: 90.0
      realised: 95.0
    expected: 5000.0
    tolerance: 1.0e-09
    note: 1,000 x (95 - 90)
  swap_pv:
    fn: core.pricing.dividend_derivs.dividend_swap_pv
    args:
      units: 1000.0
      strike: 90.0
      expected: 95.0
      df: 0.97
    expected: 4850.0
    tolerance: 1.0e-09
    note: 1,000 x 5 x 0.97
  strip:
    fn: core.pricing.dividend_derivs.dividend_strip_pv
    args:
      units: 1000.0
      strikes:
      - 90.0
      - 88.0
      - 86.0
      expected:
      - 95.0
      - 92.0
      - 90.0
      dfs:
      - 0.97
      - 0.94
      - 0.91
    expected: 12250.0
    tolerance: 1.0e-06
    note: sum units x (E - K) x DF
  implied:
    fn: core.pricing.dividend_derivs.implied_vs_forecast
    args:
      market: 88.0
      forecast: 92.0
    expected:
    - -4.0
    - -0.043478260869565216
    tolerance: 1.0e-09
    note: 88 - 92
  cancel:
    fn: core.pricing.dividend_derivs.cancellation_pnl
    args:
      units: 1000.0
      strike: 90.0
      forecast: 95.0
      cancel_fraction: 0.6
    expected: -52000
    tolerance: 1.0e-06
    note: 1,000 x (38 - 90)
  note:
    fn: core.pricing.dividend_derivs.tracker_note_value
    args:
      notional: 1000000.0
      index_total_return: 0.08
      annual_fee: 0.01
      years: 2.0
    expected: 1058508.0
    tolerance: 1.0e-06
    note: 1m x 1.08 x 0.99^2
