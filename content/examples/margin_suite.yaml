examples:
  vm:
    fn: core.margin.exchange.variation_margin_flows
    args:
      qty: 10.0
      multiplier: 50.0
      prices:
      - 5000.0
      - 5020.0
      - 5010.0
    expected:
    - 10000.0
    - -5000.0
    tolerance: 1.0e-06
    note: 10 x 50 x price change
  span_single:
    fn: core.margin.exchange.span_like_margin
    args:
      positions:
      - $: core.margin.exchange.FuturePos
        kwargs:
          product: ES
          expiry: DEC
          qty: 10
          price: 5000.0
          multiplier: 50.0
    expected:
      gross: 175000.00000000003
      credits: 0.0
      net: 175000.00000000003
    tolerance: 0.01
    note: 7% of 2.5m
  span_cal:
    fn: core.margin.exchange.span_like_margin
    args:
      positions:
      - $: core.margin.exchange.FuturePos
        kwargs:
          product: ES
          expiry: DEC
          qty: 10
          price: 5000.0
          multiplier: 50.0
      - $: core.margin.exchange.FuturePos
        kwargs:
          product: ES
          expiry: MAR
          qty: -10
          price: 4990.0
          multiplier: 50.0
    expected:
      gross: 25300.0
      credits: 0.0
      net: 25300.0
    tolerance: 0.01
    note: 1% calendar charge plus small net scan
  span_spread:
    fn: core.margin.exchange.span_like_margin
    args:
      positions:
      - $: core.margin.exchange.FuturePos
        kwargs:
          product: ES
          expiry: DEC
          qty: 10
          price: 5000.0
          multiplier: 50.0
      - $: core.margin.exchange.FuturePos
        kwargs:
          product: D1US30
          expiry: DEC
          qty: -10
          price: 5000.0
          multiplier: 50.0
    expected:
      gross: 362500.0
      credits: 140000.00000000003
      net: 222499.99999999997
    tolerance: 0.01
    note: 80% credit on the smaller scan
  schedule:
    fn: core.margin.simm_lite.schedule_im
    args:
      gross_notional: 100000000.0
      net_notional: 20000000.0
    expected:
      gross: 15000000.0
      credits: 7200000.0
      net: 7800000.0
    tolerance: 0.01
    note: gross 15m, NGR 0.2
  simm:
    fn: core.margin.simm_lite.equity_delta_margin
    args:
      sens_by_bucket:
        1:
        - 100000.0
        - -50000.0
        2:
        - 80000.0
    expected:
      gross: 5182022.120425379
      credits: 1363566.9354061806
      net: 3818455.1850191983
    tolerance: 0.01
    note: illustrative weights
  regt:
    fn: core.margin.regt.regt_requirements
    args:
      long_mv: 1000000.0
      short_mv: 500000.0
    expected:
    - gross: 750000.0
    - gross: 400000.0
    tolerance: 0.01
    note: 750k initial, 400k maintenance
  leverage:
    fn: core.margin.regt.gross_leverage_allowed
    args:
      long_mv: 1000000.0
      short_mv: 500000.0
    expected: 2.0
    tolerance: 1.0e-09
    note: 1.5m / 750k
  pm:
    fn: core.margin.portfolio_margin.portfolio_margin
    args:
      positions:
      - $: core.margin.portfolio_margin.PMPosition
        kwargs:
          ticker: A
          market_value: 1000000.0
      - $: core.margin.portfolio_margin.PMPosition
        kwargs:
          ticker: IDX
          market_value: -1000000.0
          is_index: true
    expected:
      gross: 230000.0
      credits: 160000.0
      net: 70000.0
    tolerance: 0.01
    note: worst loss across the grid
  pb:
    fn: core.margin.pb_house.pb_house_margin
    args:
      positions:
      - $: core.margin.pb_house.PBPosition
        kwargs:
          ticker: X
          market_value: 5000000.0
          price: 50.0
          adv_shares: 100000.0
          daily_vol: 0.02
          short_interest: 0.2
      - $: core.margin.pb_house.PBPosition
        kwargs:
          ticker: Y
          market_value: -2000000.0
          price: 20.0
          adv_shares: 500000.0
          daily_vol: 0.03
          short_interest: 0.25
      equity: 10000000.0
    expected:
      base: 831384.387633061
      addons: 1700000.0
      total: 2531384.387633061
    tolerance: 0.01
    note: base plus concentration and squeeze
  csa_call:
    fn: core.margin.csa.collateral_call
    args:
      exposure: 5200000.0
      held_value: 4000000.0
      terms:
        $: core.margin.csa.CsaTerms
        kwargs:
          threshold_cpty: 0.0
          mta: 250000.0
          rounding: 100000.0
    expected:
      amount: 1200000.0
    tolerance: 0.01
    note: 1.2m, above MTA, on the rounding
  dispute:
    fn: core.margin.csa.dispute
    args:
      own_call: 1200000.0
      counterparty_call: 900000.0
    expected:
      undisputed: 900000.0
      disputed: 300000.0
    tolerance: 0.01
    note: pay the smaller call first
