examples:
  arb:
    fn: core.pricing.etf.etf_arbitrage
    args:
      etf_price: 100.5
      inav: 100.0
      cu_size: 50000
      creation_fee: 5000.0
      basket_cost_bps: 3.0
      etf_half_spread_bps: 2.0
    expected:
      action: create
      premium_bps: 50.0
      threshold_bps: 15.0
      edge_bps: 35.0
      pnl_per_creation_unit: 17500.0
    tolerance: 1.0e-06
    note: 'create: sell rich ETF'
  thr1:
    fn: core.strategies.etf_arb.threshold_bps
    args:
      creation_fee: 5000.0
      cu_value: 5000000.0
      basket_bps: 3.0
      half_spread_bps: 2.0
      stress: 1.0
    expected: 15.0
    tolerance: 1.0e-09
    note: 10 + 3 + 2
  thr2:
    fn: core.strategies.etf_arb.threshold_bps
    args:
      creation_fee: 5000.0
      cu_value: 5000000.0
      basket_bps: 3.0
      half_spread_bps: 2.0
      stress: 2.0
    expected: 20.0
    tolerance: 1.0e-09
    note: 10 + 6 + 4
  thr4:
    fn: core.strategies.etf_arb.threshold_bps
    args:
      creation_fee: 5000.0
      cu_value: 5000000.0
      basket_bps: 3.0
      half_spread_bps: 2.0
      stress: 4.0
    expected: 30.0
    tolerance: 1.0e-09
    note: 10 + 12 + 8
  prem:
    fn: core.pricing.etf.premium_discount
    args:
      etf_price: 100.5
      nav: 100.0
    expected: 0.005
    tolerance: 1.0e-12
    note: 0.5%
