examples:
  fair_value:
    fn: core.pricing.adr.adr_fair_value
    args:
      local_price: 40.0
      ratio: 0.5
      fx: 1.1
    expected: 22.0
    tolerance: 1.0e-09
    note: 40 x 0.5 x 1.10
  jpy_fair_value:
    fn: core.pricing.adr.adr_fair_value
    args:
      local_price: 3000.0
      ratio: 1.0
      fx: 0.006666666666666667
    expected: 20.0
    tolerance: 1.0e-09
    note: 3,000 x 1 / 150
  band:
    fn: core.pricing.adr.adr_band
    args:
      local_price: 40.0
      ratio: 0.5
      fx: 1.1
      conversion_fee_per_adr: 0.02
      cost_bps: 10.0
    expected:
      fair_value: 22.0
      lower: 21.958
      upper: 22.042
    tolerance: 1.0e-09
    note: 22.00 +/- (0.02 + 0.022)
  arb:
    fn: core.pricing.adr.adr_arbitrage
    args:
      adr_price: 22.1
      band:
        $: core.pricing.adr.adr_band
        kwargs:
          local_price: 40.0
          ratio: 0.5
          fx: 1.1
          conversion_fee_per_adr: 0.02
          cost_bps: 10.0
    expected:
    - sell_adr_buy_local_issue
    - 0.05799999999999983
    tolerance: 1.0e-09
    note: 22.10 - 22.042
