examples:
  fee:
    fn: core.financing.sbl.loan_fee
    args:
      loan_value: 5000000.0
      fee: 0.015
      days: 30
      basis: 360
    expected: 6250.0
    tolerance: 0.005
    note: 5m x 1.5% x 30/360
  rebate_rate:
    fn: core.financing.sbl.rebate_rate
    args:
      reinvestment_rate: 0.0425
      fee: 0.015
    expected: 0.0275
    tolerance: 1.0e-09
    note: 4.25% - 1.5%
  cash_rebate:
    fn: core.financing.sbl.cash_rebate
    args:
      cash_collateral: 5100000.0
      rebate: 0.0275
      days: 30
      basis: 360
    expected: 11687.5
    tolerance: 0.005
    note: 5.1m x 2.75% x 30/360
  short_drag:
    fn: core.financing.sbl.short_cost_drag
    args:
      shares: 100000.0
      price: 50.0
      fee: 0.03
      days: 90
      basis: 360
      dividends_per_share: 1.0
    expected:
      fee: 37500.0
      dividends: 100000.0
    tolerance: 0.005
    note: fee + manufactured dividend
  short_drag_total:
    fn: core.financing.sbl.short_cost_drag
    args:
      shares: 100000.0
      price: 50.0
      fee: 0.03
      days: 90
      basis: 360
      dividends_per_share: 1.0
    expected:
      total: 137500.0
    tolerance: 0.005
    note: 37,500 + 100,000
  fee_curve_80:
    fn: core.financing.sbl.fee_from_utilisation
    args:
      utilisation: 0.8
      gc_fee_bps: 30.0
      steepness: 2.0
    expected: 222.0
    tolerance: 1.0e-06
    note: 30 x (1 + 2 x 0.64/0.2)
  fee_curve_95:
    fn: core.financing.sbl.fee_from_utilisation
    args:
      utilisation: 0.95
      gc_fee_bps: 30.0
      steepness: 2.0
    expected: 1112.999999999999
    tolerance: 1.0e-06
    note: 30 x (1 + 2 x 0.9025/0.05)
