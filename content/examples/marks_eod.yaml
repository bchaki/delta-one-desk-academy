examples:
  stale:
    fn: core.booking.marks.stale_flags
    args:
      prices:
      - 10.0
      - 10.5
      - 10.5
      - 11.13
      - 11.13
    expected:
    - 2
    - 4
    tolerance: 0
    note: exact repeats
  move:
    fn: core.booking.marks.move_flags
    args:
      prices:
      - 10.0
      - 10.5
      - 10.5
      - 11.13
      - 11.13
      threshold: 0.055
    expected:
    - 3
    tolerance: 0
    note: 6% move
  source:
    fn: core.booking.marks.source_breaks
    args:
      primary:
      - 10.0
      - 10.0
      secondary:
      - 10.0
      - 10.02
      tolerance_bps: 10.0
    expected:
    - - 1
      - 20.0
    tolerance: 1.0e-06
    note: 20 bps
  impact:
    fn: core.booking.marks.mark_impact
    args:
      shares: 1000.0
      wrong_price: 101.0
      right_price: 100.0
    expected: 1000.0
    tolerance: 1.0e-09
    note: 1,000 x 1
